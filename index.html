<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My TV Channels</title>
    <!-- 1. Include HLS.js for stream playback -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        body { font-family: sans-serif; background-color: #1a1a1a; color: white; margin: 0; padding: 20px; }
        h1 { text-align: center; }
        
        /* Controls Section */
        .controls { display: flex; gap: 10px; justify-content: center; margin-bottom: 20px; flex-wrap: wrap; }
        input { padding: 10px; border-radius: 5px; border: 1px solid #444; background: #333; color: white; }
        button { padding: 10px 20px; background-color: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; }
        button:hover { background-color: #0056b3; }
        button.fetch-btn { background-color: #28a745; }
        button.fetch-btn:hover { background-color: #218838; }

        /* Grid Layout */
        #channel-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 20px; max-width: 1200px; margin: 0 auto; }
        
        /* Channel Card */
        .channel-card { background-color: #2c2c2c; border-radius: 10px; padding: 15px; text-align: center; transition: transform 0.2s; cursor: pointer; position: relative; }
        .channel-card:hover { transform: scale(1.05); background-color: #3a3a3a; }
        .channel-logo { width: 100px; height: 100px; object-fit: contain; background-color: #000; border-radius: 5px; margin-bottom: 10px; }
        .channel-name { font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        
        /* Delete Button */
        .delete-btn { position: absolute; top: 5px; right: 5px; background: red; color: white; border: none; border-radius: 50%; width: 20px; height: 20px; cursor: pointer; font-size: 12px; display: none; }
        .channel-card:hover .delete-btn { display: block; }

        /* Video Modal */
        #videoModal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 1000; justify-content: center; align-items: center; flex-direction: column; }
        #streamPlayer { max-width: 90%; max-height: 80%; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
        .close-modal { color: white; background: #dc3545; border: none; padding: 10px 20px; margin-top: 15px; cursor: pointer; font-size: 16px; border-radius: 5px; }
        .loading { text-align: center; grid-column: 1 / -1; padding: 20px; display: none; }
    </style>
</head>
<body>

    <h1>My TV Channels</h1>

    <!-- Controls: Add Manual & Fetch Bulk -->
    <div class="controls">
        <input type="text" id="channelName" placeholder="Channel Name">
        <input type="text" id="channelLogo" placeholder="Logo URL (Optional)">
        <input type="text" id="channelStream" placeholder="Stream URL">
        <button onclick="addChannel()">Add Manual</button>
        <button class="fetch-btn" onclick="fetchBulkChannels()">Fetch Free-TV Channels</button>
        <button onclick="clearAll()" style="background-color: #dc3545;">Clear All</button>
    </div>

    <div id="loading-msg" class="loading">Fetching channels... please wait...</div>
    <div id="channel-grid"></div>

    <!-- Video Player Modal -->
    <div id="videoModal">
        <video id="streamPlayer" controls></video>
        <button class="close-modal" onclick="closeModal()">Close Player</button>
    </div>

    <script type="module">
        // Import M3U Parser directly from CDN
        import { ParseM3U } from 'https://cdn.jsdelivr.net/gh/MarketingPipeline/IPTV-Parser.js@latest/dist/iptv-parser.min.js';

        const STORAGE_KEY = 'my_tv_channels';

        // --- Core Storage Functions ---
        function getChannels() {
            const channels = localStorage.getItem(STORAGE_KEY);
            return channels ? JSON.parse(channels) : [];
        }

        function saveChannels(channels) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(channels));
        }

        // --- UI Rendering ---
        function renderChannels() {
    const grid = document.getElementById('channel-grid');
    const channels = getChannels();
    grid.innerHTML = '';

    if (channels.length === 0) {
        grid.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: #888;">No channels added yet.</p>';
        return;
    }

    channels.forEach(channel => {
        const card = document.createElement('div');
        card.className = 'channel-card';
        
        // Use placehold.co instead of via.placeholder.com
        const logoSrc = channel.logo && channel.logo.trim() !== '' ? channel.logo : 'https://placehold.co/100x100/333/FFF?text=TV';
        
        card.innerHTML = `
            <button class="delete-btn" onclick="event.stopPropagation(); deleteChannel(${channel.id})">X</button>
            <img src="${logoSrc}" alt="${channel.name}" class="channel-logo" onerror="this.src='https://placehold.co/100x100/555/FFF?text=Error'">
            <div class="channel-name">${channel.name}</div>
        `;

        card.addEventListener('click', () => playStream(channel.stream, channel.name));
        grid.appendChild(card);
    });
}

        // --- Manual Add/Delete ---
        window.addChannel = function() {
            const name = document.getElementById('channelName').value;
            const logo = document.getElementById('channelLogo').value;
            const stream = document.getElementById('channelStream').value;

            if (!name || !stream) { alert("Name and Stream URL are required."); return; }

            const channels = getChannels();
            channels.push({ name, logo, stream, id: Date.now() });
            saveChannels(channels);
            
            document.getElementById('channelName').value = '';
            document.getElementById('channelLogo').value = '';
            document.getElementById('channelStream').value = '';
            renderChannels();
        };

        window.deleteChannel = function(id) {
            if(!confirm("Delete this channel?")) return;
            let channels = getChannels().filter(ch => ch.id !== id);
            saveChannels(channels);
            renderChannels();
        };

        window.clearAll = function() {
            if(!confirm("Delete ALL channels?")) return;
            localStorage.removeItem(STORAGE_KEY);
            renderChannels();
        };

        window.fetchBulkChannels = async function() {
    const loadingMsg = document.getElementById('loading-msg');
    loadingMsg.style.display = 'block';
    
    try {
        const url = 'https://raw.githubusercontent.com/Free-TV/IPTV/master/playlists/playlist_italy.m3u8'; 
        
        const parsedData = await ParseM3U(url);
        // The library returns an object. The array of channels is in 'parsedData.items'
        const newChannelsRaw = parsedData.items; // <-- This is the fix

        const existing = getChannels();
        const existingUrls = new Set(existing.map(c => c.stream));

        const transformed = newChannelsRaw 
            .filter(ch => ch.url && ch.name) 
            .map(ch => ({
                name: ch.name,
                logo: ch.tvg?.logo || '', 
                stream: ch.url,
                id: Date.now() + Math.random()
            }))
            .filter(ch => !existingUrls.has(ch.stream));

        if (transformed.length === 0) {
            alert("No new channels found or all are duplicates.");
        } else {
            const updated = [...existing, ...transformed];
            saveChannels(updated);
            alert(`Successfully added ${transformed.length} new channels!`);
            renderChannels();
        }
        } catch (error) {
            console.error(error);
            alert("Failed to fetch channels. Check the console for details.");
        } finally {
            loadingMsg.style.display = 'none';
        }
        };

        function playStream(streamUrl, channelName) {
        // Open the raw stream URL in a new tab
        window.open(streamUrl, '_blank');
        }

        // Initial Load
        document.addEventListener('DOMContentLoaded', renderChannels);
    </script>
</body>
</html>
