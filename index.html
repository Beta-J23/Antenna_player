<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My TV Channels</title>
    <style>
        body { font-family: sans-serif; background: #1a1a1a; color: white; margin: 0; padding: 20px; }
        h1 { text-align: center; }
        #add-channel-form { display: flex; gap: 10px; justify-content: center; margin-bottom: 20px; flex-wrap: wrap; }
        input, button { padding: 10px; border-radius: 5px; border: 1px solid #444; background: #333; color: white; }
        button { border: none; cursor: pointer; }
        #channel-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 20px; max-width: 1200px; margin: 0 auto; }
        .channel-card { background: #2c2c2c; border-radius: 10px; padding: 15px; text-align: center; cursor: pointer; position: relative; }
        .channel-card:hover { transform: scale(1.05); }
        .channel-logo { width: 100px; height: 100px; object-fit: contain; background: #000; border-radius: 5px; margin-bottom: 10px; }
        .delete-btn { position: absolute; top: 5px; right: 5px; background: red; color: white; border: none; border-radius: 50%; width: 20px; height: 20px; cursor: pointer; font-size: 12px; display: none; }
        .channel-card:hover .delete-btn { display: block; }
    </style>
</head>
<body>
    <h1>My TV Channels</h1>
    <div id="add-channel-form">
        <input type="text" id="channelName" placeholder="Name">
        <input type="text" id="channelLogo" placeholder="Logo URL (Optional)">
        <input type="text" id="channelStream" placeholder="Stream URL">
        <button onclick="addChannel()">Add</button>
        <button onclick="fetchBulkChannels()">Fetch Channels</button>
        <button onclick="clearAll()" style="background: #dc3545;">Clear All</button>
    </div>
    <div id="channel-grid"></div>

    <script>
        const STORAGE_KEY = 'my_tv_channels';

        function getChannels() { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); }
        function saveChannels(channels) { localStorage.setItem(STORAGE_KEY, JSON.stringify(channels)); }

        function renderChannels() {
            const grid = document.getElementById('channel-grid');
            const channels = getChannels();
            grid.innerHTML = channels.length ? '' : '<p style="grid-column:1/-1;text-align:center;color:#888">No channels. Add one or fetch.</p>';
            channels.forEach(ch => {
                const card = document.createElement('div');
                card.className = 'channel-card';
                card.innerHTML = `
                    <button class="delete-btn" onclick="event.stopPropagation();deleteChannel(${ch.id})">X</button>
                    <img src="${ch.logo || 'https://placehold.co/100x100?text=TV'}" 
                         alt="${ch.name}" class="channel-logo" 
                         onerror="this.src='https://placehold.co/100x100?text=Error'">
                    <div>${ch.name}</div>
                `;
                card.onclick = () => window.open(ch.stream, '_blank');
                grid.appendChild(card);
            });
        }

        function addChannel() {
            const name = document.getElementById('channelName').value;
            const logo = document.getElementById('channelLogo').value;
            const stream = document.getElementById('channelStream').value;
            if (!name || !stream) { alert('Name and Stream required.'); return; }
            const channels = getChannels();
            channels.push({ name, logo, stream, id: Date.now() });
            saveChannels(channels);
            document.getElementById('channelName').value = '';
            document.getElementById('channelLogo').value = '';
            document.getElementById('channelStream').value = '';
            renderChannels();
        }

        function deleteChannel(id) {
            if(confirm('Delete?')) {
                saveChannels(getChannels().filter(ch => ch.id !== id));
                renderChannels();
            }
        }

        function clearAll() {
            if(confirm('Delete ALL?')) {
                localStorage.removeItem(STORAGE_KEY);
                renderChannels();
            }
        }

        async function fetchBulkChannels() {
            const targetUrl = 'https://raw.githubusercontent.com/Free-TV/IPTV/master/playlists/playlist_italy.m3u8';
            const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(targetUrl)}`;
            try {
                const response = await fetch(proxyUrl);
                const content = await response.text();
                const lines = content.split('\n');
                let channels = [];
                let name = '', logo = '';
                for(let line of lines) {
                    line = line.trim();
                    if(line.startsWith('#EXTINF')) {
                        name = line.split(',').pop() || 'Unknown';
                        const logoMatch = line.match(/tvg-logo="([^"]*)"/);
                        logo = logoMatch ? logoMatch[1] : '';
                    } else if(line.startsWith('http')) {
                        if(name) channels.push({ name, logo, stream: line, id: Date.now() + Math.random() });
                        name = logo = '';
                    }
                }
                const existing = getChannels();
                const existingUrls = new Set(existing.map(c => c.stream));
                const newChannels = channels.filter(c => !existingUrls.has(c.stream));
                if(newChannels.length) {
                    saveChannels([...existing, ...newChannels]);
                    alert(`Added ${newChannels.length} channels!`);
                    renderChannels();
                } else {
                    alert('No new channels found.');
                }
            } catch(e) { alert('Fetch failed. Check console.'); console.error(e); }
        }
        

        document.addEventListener('DOMContentLoaded', renderChannels);
    </script>
</body>
</html>
